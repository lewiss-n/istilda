services:
  # ---------- The website ----------
  web:
    build: .
    image: istilda-importers
    container_name: istilda-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://istilda:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/istilda
    volumes:
      # Product photos (and the old SQLite file, if you're upgrading) live here.
      - istilda-data:/app/data
    depends_on:
      db:
        condition: service_healthy

  # ---------- PostgreSQL database ----------
  db:
    image: postgres:17-alpine
    container_name: istilda-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: istilda
      POSTGRES_USER: istilda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: Africa/Nairobi
    volumes:
      - istilda-postgres:/var/lib/postgresql/data
    # Not published to the outside world: only the website can reach it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U istilda -d istilda"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256mb

  # ---------- Daily database backups into ./backups ----------
  backup:
    image: postgres:17-alpine
    container_name: istilda-backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: istilda
      PGDATABASE: istilda
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Africa/Nairobi
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Backups: one now, then every 24 hours. Keeping $${BACKUP_KEEP_DAYS} days."
        while true; do
          f=/backups/istilda-$$(date +%Y-%m-%d_%H%M).dump
          if pg_dump --format=custom --file="$$f.tmp"; then
            mv "$$f.tmp" "$$f" && echo "Saved $$f"
          else
            rm -f "$$f.tmp"; echo "Backup failed" >&2
          fi
          find /backups -name 'istilda-*.dump' -mtime +$${BACKUP_KEEP_DAYS} -delete
          sleep 86400
        done

volumes:
  istilda-data:
  istilda-postgres:
